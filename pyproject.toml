[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quickprep"
dynamic = ["version"]
description = "Protein structure preparation in the spirit of MOE QuickPrep, from open tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openmm>=8.1",
    "pdbfixer>=1.9",
    "pdb2pqr>=3.6",
    "propka>=3.5",
    "gemmi>=0.6",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
quickprep = "quickprep.prep:cli"

[tool.setuptools.dynamic]
version = {attr = "quickprep.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
