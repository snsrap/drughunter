[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "drughunter"
description = "Structure-based drug discovery toolkit that makes AI models easy for scientists to use: pocket detection, structure prep, and binder generation."
keywords = ["drug-discovery", "structure-based-drug-design", "computational-chemistry", "bioinformatics", "protein-structure", "molecular-modeling", "cheminformatics", "machine-learning"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "snsrap" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
# The viewer's server and pocketbench run on the standard library alone;
# these are quickprep's. External tools (fpocket, lacuna, NEAT-POCKET) are
# found at startup, not installed from here.
dependencies = [
    "openmm>=8.1",
    "pdbfixer>=1.9",
    "pdb2pqr>=3.6",
    "propka>=3.5",
    "gemmi>=0.6",
    "numpy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "pre-commit"]
# The ensemble detector, in this environment. Under WSL2 its MD backend can
# reach the GPU only through conda-forge's OpenMM, in an environment of its own
# (docs/lacuna-integration.md); fpocket and NEAT-POCKET cannot come from here.
lacuna = ["lacuna-pockets[openmm]>=1.2"]

[project.urls]
Repository = "https://github.com/snsrap/drughunter"
Sponsor = "https://github.com/sponsors/snsrap"

[project.scripts]
proteinviewer = "proteinviewer.server:main"
pocketbench = "pocketbench.cli:main"
quickprep = "quickprep.prep:cli"

# The version is the git tag (v1.2.0 -> 1.2.0), set by .github/workflows/release.yml.
# Outside a git checkout (the Docker build) it comes from SETUPTOOLS_SCM_PRETEND_VERSION.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["proteinviewer*", "pocketbench*", "quickprep*", "pocketgen*"]

[tool.setuptools.package-data]
# The page: no build step, served from inside the installed package.
proteinviewer = ["app/**/*"]

[tool.coverage.run]
source = ["pocketbench", "pocketgen", "proteinviewer", "quickprep"]
# Entry points, and the code that needs hardware or tools CI does not have.
omit = ["*/__main__.py", "pocketgen/neat_pocket.py", "proteinviewer/server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "graphify-out"]

[tool.ruff.lint]
select = ["E", "W505", "F", "I", "B", "UP", "SIM", "D"]
# The code base uses %-formatting throughout, zip() without strict=, and l/O
# names for coordinates; those are conventions here, not defects.
ignore = [
    "UP031", "B905", "E741",
    # Docstrings here open with a noun phrase and wrap their first sentence,
    # and not every private-ish helper carries one; the form rules (D2, D3, D4)
    # still apply.
    "D1", "D205", "D401",
    # Each pair is incompatible with its sibling; D211 and D212 are kept.
    "D203", "D213",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Closures defined in a loop and called inside it, before the variable moves on.
"pocketgen/neat_pocket.py" = ["B023", "E402"]
"quickprep/prep.py" = ["B023", "E731", "E501"]
# Long literal tables and messages.
"pocketbench/structure.py" = ["E501"]
# Imports after a sys.path change, and fixtures of long lines.
"tests/**" = ["E402", "E501"]
# Throwaway script.
"docs/validation/*.py" = ["SIM115"]
# A frozen dataclass default.
"pocketbench/score.py" = ["B008"]
