[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketbench"
dynamic = ["version"]
description = "Superpose structures and score pocket detectors against apo/holo ground truth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pocketbench = "pocketbench.cli:main"

[tool.setuptools.dynamic]
version = {attr = "pocketbench.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
