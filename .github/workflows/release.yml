name: Release

# Branching: feature branches start from dev and merge into dev. dev is merged
# into main by hand.
#
#   push to dev   tags a minor release   (v1.2.0 -> v1.3.0)
#   push to main  tags a major release   (v1.3.0 -> v2.0.0) and builds and
#                 publishes the Docker image
#
# This is the only place the image is built or pushed. The tag is created here
# rather than by a tag-triggered workflow, because a tag pushed with
# GITHUB_TOKEN does not start other workflows.

on:
  push:
    branches: [dev, main]

permissions:
  contents: write
  packages: write

# Tags are computed from the existing ones, so runs must not overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v0.3.0}
          IFS=. read -r major minor _ <<< "${latest#v}"
          if [ "$GITHUB_REF_NAME" = main ]; then
            version="$((major + 1)).0.0"
          else
            version="${major}.$((minor + 1)).0"
          fi
          git tag "v${version}"
          git push origin "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
