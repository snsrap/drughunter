name: Release

# Every push to dev tags the next minor release (v1.2.0 -> v1.3.0). Major
# releases are tagged by hand on main and built by image.yml.

on:
  push:
    branches: [dev]

permissions:
  contents: write

# Tags are computed from the existing ones, so runs must not overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v0.3.0}
          IFS=. read -r major minor _ <<< "${latest#v}"
          tag="v${major}.$((minor + 1)).0"
          git tag "$tag"
          git push origin "$tag"
