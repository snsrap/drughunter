name: Release

# Every push to dev releases the next minor version (v1.2.0 -> v1.3.0): the
# tests run, the tag is made, and the package goes to PyPI and to a GitHub
# release. A major release is tagged by hand on main (git tag v2.0.0); the same
# tests, build and publish run for it, and image.yml builds the image.

on:
  push:
    branches: [dev]
    tags: ["v[0-9]+.0.0"]
  # Publish an existing tag again, for example after a failed PyPI step.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (v1.0.0)
        required: true

permissions:
  contents: read

# Tags are computed from the existing ones, so runs must not overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest --ignore=tests/e2e

  tag:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v1.0.0}
          IFS=. read -r major minor _ <<< "${latest#v}"
          tag="v${major}.$((minor + 1)).0"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, tag]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag || inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
