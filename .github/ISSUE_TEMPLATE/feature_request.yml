name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - proteinviewer (viewer / server)
        - pocketbench
        - quickprep
        - New area
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and where it gets stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like DrugHunter to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you use today.
  - type: markdown
    attributes:
      value: |
        Sponsoring the project does not give priority to feature requests.
